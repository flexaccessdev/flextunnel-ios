name: Release unsigned iOS (Manual)

# ---------------------------------------------------------------------------
# INTERNAL NOTE (team only — we own the dev.flexaccess.flextunnel* App IDs)
#
# The published flextunnel-ios-unsigned.xcarchive.zip is the "ready-to-sign"
# artifact. Because we own the App IDs it was built with, we can turn it into
# an ad-hoc IPA with a single xcodebuild -exportArchive — no manual codesign,
# and it re-signs the app AND the embedded widget together. (External signers
# who must rebrand the bundle IDs use docs/signing-unsigned-ipa.md instead;
# that route cannot rename bundle IDs.)
#
#   ditto -x -k flextunnel-ios-unsigned.xcarchive.zip .
#   cat > ExportOptions.plist <<'PLIST'
#   <?xml version="1.0" encoding="UTF-8"?>
#   <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
#   <plist version="1.0"><dict>
#     <key>method</key><string>release-testing</string>   <!-- Xcode's current name for Ad Hoc -->
#     <key>teamID</key><string>YOUR_TEAM_ID</string>
#     <key>signingStyle</key><string>automatic</string>
#     <key>destination</key><string>export</string>
#   </dict></plist>
#   PLIST
#   xcodebuild -exportArchive \
#     -archivePath flextunnel-ios-unsigned.xcarchive \
#     -exportPath export \
#     -exportOptionsPlist ExportOptions.plist \
#     -allowProvisioningUpdates
#
# -allowProvisioningUpdates + signingStyle automatic lets Xcode create/refresh
# the ad-hoc profiles for both bundles against a signed-in Apple ID (or an App
# Store Connect API key via -authenticationKeyPath). Ad Hoc installs only on
# device UDIDs already registered with the team, so register targets first.
# ---------------------------------------------------------------------------

# Like the sibling repos (ezvpn-apple), the tag and title come from the version
# declared in project.yml (MARKETING_VERSION / CURRENT_PROJECT_VERSION, shared
# by the app and widget targets) plus the pinned flextunnel core
# (FLEXTUNNEL_CORE_VERSION). A run aborts if that tag already exists, so every
# release needs a version bump. The iOS client is alpha — iOS suspends the
# in-process tunnel in the background and there is no Network Extension, so it
# is not as stable as the other flextunnel clients — and every release is
# therefore published as a GitHub prerelease, titled "Alpha", whatever branch it
# runs from; a branch other than main is additionally named in the title. Drop
# the alpha marking here, in README.md and in AppVersionFooter.swift together
# when the client graduates. Manual only.
on:
  workflow_dispatch:

permissions:
  contents: write

# One run at a time; a second dispatch queues instead of racing on the tag.
concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      build: ${{ steps.tag.outputs.build }}
      release_tag: ${{ steps.tag.outputs.release_tag }}
      release_title: ${{ steps.tag.outputs.release_title }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          # Tag and title come from the version declared in project.yml, which
          # the app and widget targets must share. Every release is an alpha
          # prerelease; a branch other than main is named in the title.
          versions="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([0-9.]+)"?.*/\1/p' project.yml | sort -u)"
          builds="$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*"?([0-9]+)"?.*/\1/p' project.yml | sort -u)"
          [[ -n "$versions" && "$(wc -l <<<"$versions")" -eq 1 ]] || {
            echo "::error::project.yml must declare exactly one MARKETING_VERSION across targets (found: $(echo $versions))"
            exit 1
          }
          [[ -n "$builds" && "$(wc -l <<<"$builds")" -eq 1 ]] || {
            echo "::error::project.yml must declare exactly one CURRENT_PROJECT_VERSION across targets (found: $(echo $builds))"
            exit 1
          }
          version="$versions"
          core="$(sed -nE 's/^[[:space:]]*FLEXTUNNEL_CORE_VERSION:[[:space:]]*"?([0-9.]+)"?.*/\1/p' project.yml | head -1)"
          [[ -n "$core" ]] || {
            echo "::error::Could not parse FLEXTUNNEL_CORE_VERSION from project.yml"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$builds" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "release_title=Alpha (${{ github.ref_name }}) iOS v$version ($builds, core $core)" >> "$GITHUB_OUTPUT"
          else
            echo "release_title=Alpha iOS v$version ($builds, core $core)" >> "$GITHUB_OUTPUT"
          fi

      - name: Abort if tag already exists
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.tag.outputs.release_tag }}" | grep -q .; then
            echo "::error::Tag ${{ steps.tag.outputs.release_tag }} already exists on remote"
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ steps.tag.outputs.release_tag }}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            echo "Deleting stale draft release ${{ steps.tag.outputs.release_tag }}"
            gh release delete "${{ steps.tag.outputs.release_tag }}" --yes
          fi
          # Alpha: always a prerelease (see the header comment). Notes are
          # generated against the previous release, which is also a prerelease.
          gh release create "${{ steps.tag.outputs.release_tag }}" \
            --draft \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "${{ steps.tag.outputs.release_title }}" \
            --generate-notes

  build:
    needs: setup
    name: Build unsigned IPA and archive
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device archive
        run: |
          xcodebuild archive \
            -project Flextunnel.xcodeproj \
            -scheme FlextunnelApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/flextunnel-ios-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM=

      - name: Package and verify unsigned artifacts
        run: |
          archive_path="$RUNNER_TEMP/flextunnel-ios-unsigned.xcarchive"
          artifact_dir="$RUNNER_TEMP/flextunnel-ios-artifacts"
          app_path="$archive_path/Products/Applications/Flextunnel.app"
          widget_path="$app_path/PlugIns/FlextunnelWidgets.appex"
          package_root="$RUNNER_TEMP/flextunnel-ipa"

          if [[ ! -d "$app_path" ]]; then
            echo "::error::Archived app not found at $app_path"
            exit 1
          fi

          if [[ ! -d "$widget_path" ]]; then
            echo "::error::Widget extension not found at $widget_path"
            exit 1
          fi

          for bundle in "$app_path" "$widget_path"; do
            short="$(plutil -extract CFBundleShortVersionString raw -o - \
              "$bundle/Info.plist")"
            build="$(plutil -extract CFBundleVersion raw -o - \
              "$bundle/Info.plist")"
            if [[ "$short ($build)" != "${{ needs.setup.outputs.version }} (${{ needs.setup.outputs.build }})" ]]; then
              echo "::error::$bundle reports version $short ($build), not ${{ needs.setup.outputs.version }} (${{ needs.setup.outputs.build }})"
              exit 1
            fi
          done

          while IFS= read -r bundle; do
            if codesign --display "$bundle" >/dev/null 2>&1; then
              echo "::error::$bundle unexpectedly has a code signature"
              exit 1
            fi
          done < <(
            find "$app_path" -type d \
              \( -name "*.app" -o -name "*.appex" -o -name "*.framework" \) \
              -print
          )

          if find "$app_path" -name embedded.mobileprovision -print -quit \
            | grep -q .; then
            echo "::error::The archived app unexpectedly embeds a profile"
            exit 1
          fi

          if [[ "$(plutil -extract UIBackgroundModes.0 raw -o - \
            "$app_path/Info.plist")" != "location" ]]; then
            echo "::error::The archived app lost its background location mode"
            exit 1
          fi

          if [[ -z "$(plutil -extract NSLocationWhenInUseUsageDescription raw \
            -o - "$app_path/Info.plist")" ]]; then
            echo "::error::The archived app lost its location usage description"
            exit 1
          fi

          if [[ "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw \
            -o - "$widget_path/Info.plist")" != \
            "com.apple.widgetkit-extension" ]]; then
            echo "::error::The embedded extension is not a WidgetKit extension"
            exit 1
          fi

          mkdir -p "$artifact_dir" "$package_root/Payload"
          ditto --norsrc --noextattr --noqtn --noacl \
            "$app_path" \
            "$package_root/Payload/Flextunnel.app"
          ditto -c -k --keepParent \
            --norsrc --noextattr --noqtn --noacl \
            "$package_root/Payload" \
            "$artifact_dir/flextunnel-unsigned.ipa"
          ditto -c -k --keepParent \
            --norsrc --noextattr --noqtn --noacl \
            "$archive_path" \
            "$artifact_dir/flextunnel-ios-unsigned.xcarchive.zip"

          unzip -tq "$artifact_dir/flextunnel-unsigned.ipa"
          unzip -tq "$artifact_dir/flextunnel-ios-unsigned.xcarchive.zip"

          if unzip -Z1 "$artifact_dir/flextunnel-unsigned.ipa" \
            | grep -Eq '(^|/)(__MACOSX|\._)'; then
            echo "::error::The IPA contains unexpected macOS metadata"
            exit 1
          fi

          (
            cd "$artifact_dir"
            shasum -a 256 \
              flextunnel-unsigned.ipa \
              flextunnel-ios-unsigned.xcarchive.zip \
              > SHA256SUMS.txt
          )

      - name: Upload unsigned IPA and archive
        uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: ${{ runner.temp }}/flextunnel-ios-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-release:
    needs: [setup, build]
    if: always() && needs.setup.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: List release artifacts
        run: ls -la artifacts/

      - name: Upload artifacts to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.setup.outputs.release_tag }}" artifacts/* --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.setup.outputs.release_tag }}" --draft=false
