# Per-repo values for the shared ../devtools scripts (see
# ../devtools/templates/devtools.conf.sample for every key).
APP_NAME=flextunnel
PROJECT_NAME=Flextunnel
SCHEME=FlextunnelApp
PRODUCT_NAME=Flextunnel
BUNDLE_ID=dev.flexaccess.flextunnel

CORE_REPO=flextunnel
CORE_GH_REPO=flexaccessdev/flextunnel
CORE_BUILD_CMD="./build-ios.sh release"

XCFW_ASSET=libflextunnel-ios.xcframework.zip
XCFW_PACKAGE_PATH=Packages/Flextunnel
LOCAL_XCFW_ENV=FLEXTUNNEL_LOCAL_XCFRAMEWORK

# The app's own version is bumped by hand; only the core pin (footer version)
# follows the release tag.
BUMP_VERSION_MODE=core-key
CORE_VERSION_KEY=FLEXTUNNEL_CORE_VERSION

OTA_APP_TITLE=Flextunnel

# ci/ci.sh's default set includes `device`, which signs — codesign over plain
# ssh can hit a locked login keychain, so mac-ci runs the signing-free set.
MAC_CI_DEFAULT_JOBS="simulator smoke unsigned"
